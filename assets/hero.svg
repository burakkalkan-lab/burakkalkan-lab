  <radialGradient id="glow"><stop offset="0" stop-color="#D7FB59" stop-opacity=".16"/><stop offset="1" stop-color="#D7FB59" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#F9F9F2" stroke-opacity=".055" stroke-width="1"/></pattern>
</defs>
