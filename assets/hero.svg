<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Burak Kalkan — LegalTech and AI Systems</title>
<desc id="desc">Dark ink banner with lime accents, geometric workflow nodes, and human-review process diagram.</desc>
